name: Windows VST3 Build

concurrency:
  group: windows-vst3-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - "STUTTER_LAB_VST3/**"
      - "scripts/**"
      - ".github/workflows/windows-vst3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build STUTTER LAB (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -S STUTTER_LAB_VST3 -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DSTUTTERLAB_BUILD_TESTS=ON

      - name: Build VST3 and core tests
        run: cmake --build build --config Release --target STUTTER_LAB_VST3 StutterLabCoreTests --parallel

      - name: Run core tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate VST3 lifecycle and state with pluginval
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "pluginval_Windows.zip"
          $dest = Join-Path $env:RUNNER_TEMP "pluginval"
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $validator = Get-ChildItem -Path $dest -Filter "pluginval.exe" -Recurse | Select-Object -First 1
          if ($null -eq $validator) { throw "pluginval.exe was not found in the downloaded archive." }
          $plugin = Join-Path (Get-Location) "build/STUTTER_LAB_artefacts/Release/VST3/STUTTER LAB.vst3"
          if (-not (Test-Path -LiteralPath $plugin)) { throw "Built VST3 bundle not found: $plugin" }
          $logDir = Join-Path $env:RUNNER_TEMP "pluginval-logs"
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          & $validator.FullName --strictness-level 5 --output-dir $logDir $plugin
          $pluginvalExitCode = $LASTEXITCODE
          if ($pluginvalExitCode -ne 0) { exit $pluginvalExitCode }

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs
          path: ${{ runner.temp }}/pluginval-logs/
          if-no-files-found: ignore

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: STUTTER-LAB-Windows-x64-VST3
          path: build/STUTTER_LAB_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 30
